<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ad0f8f" />
    <title>Boston Ball</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="level-status" id="level-name">LEVEL 0: DEV PLANE</div>
    <div class="timer" id="timer" hidden>00:00.000</div>
    <div class="gift-reveal" id="gift-reveal" aria-hidden="true">
      <div class="gift-title">A LITTLE SOMETHING FOR YOU</div>
      <div class="gift-continue">CLICK TO CONTINUE</div>
    </div>
    <div class="controls" aria-label="Controls">
      <span>WASD / ARROWS</span>
      <span>R TO RESET</span>
      <span>0 / 1 LEVEL</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
